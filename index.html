<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Meteorológico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Mapa Meteorológico de México</h1>
    <p>Consumo de APIs OpenStreetMap y Open-Meteo. Por Orlando Gabriel Caballero Pedraza</p>
  </header>

  <main>
    <div class="search-container">
      <input type="text" id="city-input" placeholder="Escribe un lugar (ej. Lerma, Toluca, Monterrey)...">
      <button id="search-btn">Consultar</button>
    </div>

    <div id="weather-card" class="weather-card">
      <p>Escribe un lugar para ver su clima y su mapa.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
